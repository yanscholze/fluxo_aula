services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fluxo_pessoal
      MYSQL_USER: fluxo
      MYSQL_PASSWORD: ${DB_PASSWORD:-fluxo_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fluxo_root_local}
    volumes:
      - fluxo-db:/var/lib/mysql
      - ./database/01-banco.sql:/docker-entrypoint-initdb.d/01-banco.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 25
      start_period: 25s
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      DB_HOST: db
      DB_USER: fluxo
      DB_PASSWORD: ${DB_PASSWORD:-fluxo_local}
    ports:
      - "127.0.0.1:${PORT:-5174}:5174"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  fluxo-db:
